<script type="importmap">

  <script>
    window.__API_URL__ = "/api";
  </script>
  <script id="auth-guard">
    // Session handling for POST /api (server-side cookie session, issue #5).
    // Wraps window.fetch: a 401 with code "auth_required" means the session cookie is
    // missing or expired, so drop the local "logged in" hint and reload to the login form.
    // A login 401 ("Invalid credentials") has no code and is left for the app to show.
    (function() {
      var NOTICE_KEY = "sessionExpiredNotice";
      var expiring = false;

      function isApiPost(input, init) {
        try {
          var url = typeof input === "string" ? input : (input && input.url) || String(input);
          var method = (init && init.method) || (input && input.method) || "GET";
          return String(method).toUpperCase() === "POST" &&
            new URL(url, window.location.href).pathname === "/api";
        } catch (e) {
          return false;
        }
      }

      function onSessionExpired() {
        if (expiring) return;
        expiring = true;
        try {
          localStorage.removeItem("sessionToken");
          localStorage.removeItem("currentUser");
          sessionStorage.setItem(NOTICE_KEY, "1");
        } catch (e) {}
        window.location.reload();
      }

      var originalFetch = window.fetch;
      window.fetch = function(input, init) {
        var promise = originalFetch.apply(this, arguments);
        if (!isApiPost(input, init)) return promise;
        return promise.then(function(response) {
          try {
            if (response.status === 401) {
              response.clone().json().then(function(body) {
                if (body && body.code === "auth_required") onSessionExpired();
              }).catch(function() {});
            } else if (response.ok) {
              // A successful call means the user is signed in: the expiry notice is stale.
              sessionStorage.removeItem(NOTICE_KEY);
              var notice = document.getElementById("session-notice");
              if (notice) notice.style.display = "none";
            }
          } catch (e) {}
          return response;
        });
      };

      window.addEventListener("DOMContentLoaded", function() {
        var notice = document.getElementById("session-notice");
        var show = sessionStorage.getItem(NOTICE_KEY) === "1" && !localStorage.getItem("sessionToken");
        if (notice && show) notice.style.display = "block";
      });
    })();
  </script>

</head>
<body class="bg-slate-50 min-h-screen">
    <!-- Top banner: Booklet button hidden on login page, displayed when authenticated -->
    <div class="max-w-md mx-auto pt-4 px-4 flex justify-between items-center text-xs">
      <span class="font-bold text-slate-400 tracking-wider">GROUP FINANCE · YA5</span>
      <a id="booklet-link" href="/booklet" style="display: none;" class="items-center gap-1.5 px-3 py-1.5 bg-white hover:bg-slate-100 text-indigo-600 font-bold rounded-full border border-slate-200 shadow-sm transition-all" title="查看小组每月奉献记录 (官方连排册子)">
        📖 查看每月奉献册子 ↗
      </a>
    </div>

    <!-- Shown after a session-expiry redirect; hidden again on the next successful API call -->
    <div id="session-notice" role="status" style="display: none;" class="max-w-md mx-auto mt-3 px-4 py-2 bg-amber-50 border border-amber-200 text-amber-800 text-sm rounded-lg text-center">登录已过期，请重新登录。</div>

    <!-- React will mount the entire application inside this div -->
    <div id="root"></div>

    <script>
      (function() {
        function syncBookletVisibility() {
          const isAuth = !!localStorage.getItem("currentUser") || !!localStorage.getItem("sessionToken");
          const btn = document.getElementById("booklet-link");
          if (btn) {
            btn.style.display = isAuth ? "inline-flex" : "none";
          }
        }
        window.addEventListener("DOMContentLoaded", syncBookletVisibility);
        window.addEventListener("storage", syncBookletVisibility);
        const observer = new MutationObserver(syncBookletVisibility);
        window.addEventListener("DOMContentLoaded", () => {
          const root = document.getElementById("root");
          if (root) observer.observe(root, { childList: true, subtree: true });
        });
      })();
    </script>

    <!-- Datalist for Item Suggestions -->
    <datalist id="item-suggestions">
        <option value="同工大会"></option>
        <option value="布道会"></option>
        <option value="小组"></option>
        <option value="休息"></option>
        <option value="Outing"></option>
    </datalist>
</body>
