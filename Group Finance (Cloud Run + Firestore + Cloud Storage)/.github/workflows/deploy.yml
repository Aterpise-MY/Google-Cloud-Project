name: CI/CD Monorepo Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# 1. Concurrency Control
# Automatically cancels any in-progress runs on the same branch when new commits are pushed
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Permissions required for Workload Identity Federation (OIDC)
permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # Change Detection Job
  # Evaluates modified paths and outputs boolean flags for each microservice
  # ============================================================================
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Filter Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            web:
              - 'services/web/**'
            api:
              - 'services/api/**'

  # ============================================================================
  # Service: WEB (Frontend / Node.js)
  # ============================================================================
  test-web:
    name: Test Web Service
    needs: detect-changes
    if: needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          # Cache npm dependencies based on lockfile to speed up execution
          cache: 'npm'
          cache-dependency-path: services/web/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter and Tests
        run: |
          npm run lint --if-present
          npm test --if-present

  deploy-web:
    name: Deploy Web Service to GCP
    needs: [detect-changes, test-web]
    # Deploy only on push to main and if files in services/web actually changed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Modern, keyless authentication via GCP Workload Identity Federation (OIDC)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build Web Artifacts
        run: |
          npm ci
          npm run build --if-present

      - name: Deploy Web to GCP
        run: |
          echo "Deploying web service (e.g., to Cloud Storage bucket, Firebase, or Cloud Run)..."
          # Example for deploying static frontend to Cloud Storage / CDN:
          # gcloud storage rsync dist/ gs://${{ secrets.GCP_WEB_BUCKET_NAME }}/ --recursive --delete-unmatched-destination-objects

  # ============================================================================
  # Service: API (Backend / Python)
  # ============================================================================
  test-api:
    name: Test API Service
    needs: detect-changes
    if: needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Cache pip packages based on requirements.txt
          cache: 'pip'
          cache-dependency-path: services/api/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run Linter and Tests
        run: |
          if command -v pytest >/dev/null 2>&1; then pytest; else echo "No pytest found, skipping"; fi

  deploy-api:
    name: Deploy API Service to GCP
    needs: [detect-changes, test-api]
    # Deploy only on push to main and if files in services/api actually changed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.detect-changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Modern, keyless authentication via GCP Workload Identity Federation (OIDC)
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy API to Cloud Run
        run: |
          echo "Deploying API to Google Cloud Run..."
          # Example Cloud Run deploy from source or container:
          # gcloud run deploy api-service \
          #   --source . \
          #   --region us-central1 \
          #   --platform managed \
          #   --allow-unauthenticated
