    <style>
        @font-face {
            font-family: Carlito;
            font-weight: 400;
            font-style: normal;
            font-display: swap;
            src: local("Carlito"), local("Carlito-Regular"),
                 url(https://fonts.gstatic.com/s/carlito/v4/3Jn9SDPw3m-pk039DDeBTFcHXuA.woff2) format("woff2");
        }
        @font-face {
            font-family: Carlito;
            font-weight: 700;
            font-style: normal;
            font-display: swap;
            src: local("Carlito Bold"), local("Carlito-Bold"),
                 url(https://fonts.gstatic.com/s/carlito/v4/3Jn4SDPw3m-pk039BIykWXolU8pB2Os.woff2) format("woff2");
        }
        @page {
            size: A4 landscape;
            margin: 10mm 12mm;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        .form-input {
            transition: all 0.2s;
        }
        input[type="date"] {
            color: #000000 !important;
            -webkit-text-fill-color: #000000 !important;
        }
        input[type="date"]::-webkit-datetime-edit {
            color: #000000;
        }

        /* Traditional Paper Offering Booklet Styles */
        .booklet-sheet {
            background: #fff;
            margin: 24px auto;
            position: relative;
            color: #000;
            width: 760px;
            min-height: 500px;
            padding: 44px 52px 60px 52px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(15, 23, 42, 0.12), 0 0 1px rgba(15, 23, 42, 0.2);
            font-family: Calibri, Carlito, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
        }
        .booklet-sheet h1 {
            margin: 0;
            font-family: Times, "Times New Roman", "Liberation Serif", "Songti SC", STSong, SimSun, "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-weight: 700;
            font-size: 20px;
            line-height: 26px;
            text-align: center;
            letter-spacing: 1px;
            color: #000;
        }
        .booklet-sheet .hdr {
            font-family: Times, "Times New Roman", "Liberation Serif", "Songti SC", STSong, SimSun, "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 20px;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            color: #000;
        }
        .booklet-sheet .hdr u {
            text-decoration: underline;
            text-underline-offset: 3px;
            text-decoration-thickness: 1px;
            padding: 0 6px;
        }
        .booklet-sheet table.paper-table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
            margin-top: 28px;
        }
        .booklet-sheet table.paper-table th,
        .booklet-sheet table.paper-table td {
            border: 1px solid #000;
            text-align: left;
            vertical-align: middle;
            overflow-wrap: anywhere;
            color: #000;
        }
        .booklet-sheet table.paper-table th {
            font-family: Times, "Times New Roman", "Liberation Serif", "Songti SC", STSong, SimSun, "Noto Serif CJK SC", "Noto Serif SC", serif;
            font-weight: 700;
            text-align: center;
            height: 36px;
            padding: 4px 6px;
            font-size: 13.5px;
            background: #fff;
        }
        .booklet-sheet table.paper-table td {
            font-family: Calibri, Carlito, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            font-weight: 400;
            height: 29px;
            padding: 4px 7px;
            font-size: 13.5px;
        }
        .booklet-sheet table.paper-table td.d {
            font-family: Arial, "Liberation Sans", Helvetica, sans-serif;
            text-align: center;
        }
        .booklet-sheet table.paper-table td.n,
        .booklet-sheet table.paper-table td.b {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }
        .booklet-sheet table.paper-table th.col-act,
        .booklet-sheet table.paper-table td.col-act {
            border: none !important;
            background: transparent !important;
            padding: 0 0 0 8px !important;
            width: 68px !important;
            text-align: left !important;
        }
        .booklet-sheet .btn-del {
            background: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .booklet-sheet .btn-del:hover {
            background: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }
        .booklet-sheet .foot {
            margin-top: 32px;
            font-family: Calibri, Carlito, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
            font-weight: 700;
            font-size: 14px;
            line-height: 22px;
            color: #000;
        }
        .booklet-sheet .foot .row {
            display: flex;
            justify-content: space-between;
            gap: 24px;
        }
        .booklet-sheet .foot .row-date {
            margin-top: 12px;
        }

        @media print {
            html, body {
                background: #fff !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            .no-print,
            .print\:hidden,
            .col-act,
            .btn-del {
                display: none !important;
            }
            .booklet-sheet {
                width: 100% !important;
                max-width: 945px !important;
                margin: 0 auto !important;
                padding: 20px 28px !important;
                box-shadow: none !important;
                border-radius: 0 !important;
                page-break-after: always;
                break-after: page;
            }
        }
    </style>
